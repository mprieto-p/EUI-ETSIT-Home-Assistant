  - alias: "ETSIT Alumbrado sincronizar intensidad automatica"
    triggers:
      - trigger: state
        entity_id:
          - sensor.etsit_alumbrado_intensidad_recomendada
          - sensor.etsit_irradiancia_solar
          - sensor.etsit_solar_nubosidad
          - input_boolean.etsit_presencia_alumbrado
          - input_boolean.etsit_alumbrado_modo_manual_intensidad
    conditions:
      - condition: state
        entity_id: input_boolean.etsit_alumbrado_modo_manual_intensidad
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.etsit_alumbrado_intensidad_general
        data:
          value: "{{ states('sensor.etsit_alumbrado_intensidad_recomendada') | int(0) }}"
    mode: restart

  - alias: "ETSIT Alumbrado gestionar temporizador intensidad manual"
    triggers:
      - trigger: state
        entity_id: input_boolean.etsit_alumbrado_modo_manual_intensidad

    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.etsit_alumbrado_modo_manual_intensidad
                state: "on"
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.etsit_alumbrado_intensidad_manual

          - conditions:
              - condition: state
                entity_id: input_boolean.etsit_alumbrado_modo_manual_intensidad
                state: "off"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.etsit_alumbrado_intensidad_manual

              - action: input_number.set_value
                target:
                  entity_id: input_number.etsit_alumbrado_intensidad_general
                data:
                  value: "{{ states('sensor.etsit_alumbrado_intensidad_recomendada') | int(0) }}"

    mode: restart

  - alias: "ETSIT Alumbrado volver a intensidad automatica"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.etsit_alumbrado_intensidad_manual
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.etsit_alumbrado_modo_manual_intensidad

      - action: input_number.set_value
        target:
          entity_id: input_number.etsit_alumbrado_intensidad_general
        data:
          value: "{{ states('sensor.etsit_alumbrado_intensidad_recomendada') | int(0) }}"
    mode: single

rest_command:
  get_dali_light_level:
    url: "https://cedint-lab.pdxeng.ch:8000/cms/api/v1.0/data/last/devices/{{ device_uid }}/objects"
    method: get
    headers:
      Authorization: "Bearer {{ state_attr('sensor.pxd_cms_tokenizer', 'token') }}"
      Content-Type: application/json

input_number:
  # ------------------------------------------------------------
  # Riego - Duracion de riego
  # ------------------------------------------------------------

  etsit_riego_duracion:
    name: ETSIT Riego duracion
    min: 10
    max: 3600
    step: 10
    unit_of_measurement: "s"
    icon: mdi:timer-outline

  etsit_alumbrado_intensidad_general:
    name: ETSIT Alumbrado intensidad general
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:brightness-6

timer:
