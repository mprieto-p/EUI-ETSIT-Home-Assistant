        unique_id: etsit_solar_estado_cielo
        state: >
          {% set estado = states('weather.cedint') %}
          {% if estado == 'sunny' %}
            Despejado
          {% elif estado == 'partlycloudy' %}
            Parcialmente nublado
          {% elif estado == 'cloudy' %}
            Nublado
          {% elif estado == 'rainy' %}
            Lluvia
          {% elif estado == 'pouring' %}
            Lluvia intensa
          {% else %}
            {{ estado }}
          {% endif %}
        icon: mdi:weather-partly-cloudy

