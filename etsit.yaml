        state: >
          {% set estado = states('weather.cedint') %}
          {% if estado == 'sunny' %}
            Despejado
          {% elif estado == 'clear-night' %}
            Noche despejada
          {% elif estado == 'partlycloudy' %}
            Parcialmente nublado
          {% elif estado == 'cloudy' %}
            Nublado
          {% elif estado == 'rainy' %}
            Lluvia
          {% elif estado == 'pouring' %}
            Lluvia intensa
          {% elif estado == 'windy' %}
            Viento
          {% elif estado == 'fog' %}
            Niebla
          {% else %}
            {{ estado }}
          {% endif %}
