  # ------------------------------------------------------------
  # Riego - Apagar zona al terminar temporizador
  # ------------------------------------------------------------

  - alias: "ETSIT Riego apagar zona 1 al terminar temporizador"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.etsit_timer_riego_1
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.etsit_riego_1_activo
    mode: single

