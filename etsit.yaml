  - alias: "ETSIT Riego apagar zona 6 al terminar temporizador"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.etsit_timer_riego_6
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.etsit_riego_6_activo
    mode: single

  - alias: "ETSIT Alumbrado encender por baja luz natural"
    triggers:
      - trigger: state
        entity_id: sensor.etsit_alumbrado_recomendacion

      - trigger: state
        entity_id: sensor.etsit_alumbrado_luminarias_encendidas
        for:
          minutes: 1

    conditions:
      - condition: state
        entity_id: sensor.etsit_alumbrado_recomendacion
        state: "Encender luminarias"

      - condition: template
        value_template: >
          {% set encendidas = states('sensor.etsit_alumbrado_luminarias_encendidas') | int(0) %}
          {% set totales = states('sensor.etsit_alumbrado_luminarias_totales') | int(40) %}
          {{ encendidas < totales }}

    actions:
      - action: input_boolean.turn_on
