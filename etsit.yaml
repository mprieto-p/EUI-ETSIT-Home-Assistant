  - alias: "ETSIT Alumbrado apagar por luz natural suficiente"
    triggers:
      - trigger: state
        entity_id: sensor.etsit_alumbrado_recomendacion

      - trigger: state
        entity_id: sensor.etsit_alumbrado_luminarias_encendidas
        for:
          minutes: 1

    conditions:
      - condition: state
        entity_id: sensor.etsit_alumbrado_recomendacion
        state: "Mantener apagadas"

      - condition: template
        value_template: >
          {{ states('sensor.etsit_alumbrado_luminarias_encendidas') | int(0) > 0 }}

    actions:
      - action: input_boolean.turn_off
        target:
