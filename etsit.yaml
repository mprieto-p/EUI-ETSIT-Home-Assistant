        state: "{{ states('sensor.etsit_riego_probabilidad_lluvia') | float(0) >= 70 }}"
        icon: mdi:weather-pouring

      - name: "ETSIT Riego aviso regando sin recomendacion"
        unique_id: etsit_riego_aviso_regando_sin_recomendacion
        state: >
          {% set zonas_activas =
            is_state('input_boolean.etsit_riego_1_activo', 'on') or
            is_state('input_boolean.etsit_riego_2_activo', 'on') or
            is_state('input_boolean.etsit_riego_3_activo', 'on') or
            is_state('input_boolean.etsit_riego_4_activo', 'on') or
            is_state('input_boolean.etsit_riego_5_activo', 'on') or
