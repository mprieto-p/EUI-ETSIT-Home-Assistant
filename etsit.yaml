# ============================================================
# ETSIT - Espacio Urbano Inteligente
# ============================================================

template:
  - sensor:
      # ------------------------------------------------------------
      # Sensores de prueba iniciales
      # ------------------------------------------------------------

      - name: "ETSIT Radiación UV"
        unique_id: etsit_radiacion_uv
        unit_of_measurement: "UV"
        state: "{{ state_attr('weather.cedint', 'uv_index') | float(0) }}"
        icon: mdi:sun-wireless

      - name: "ETSIT Irradiancia solar"
        unique_id: etsit_irradiancia_solar
        unit_of_measurement: "W/m²"
        state: >
          {% set hora = now().hour %}
          {% set minuto = now().minute %}
          {% set h = hora + minuto / 60 %}
          {% set nubosidad = state_attr('weather.cedint', 'cloud_coverage') | float(0) %}
          {% set factor_nubes = 1 - (nubosidad / 100 * 0.75) %}

          {% if h < 7 or h > 21 %}
            0
          {% elif h < 12 %}
            {{ (((h - 7) * 150) * factor_nubes) | round(0) }}
          {% elif h < 16 %}
            {{ ((750 - ((h - 12) * 35)) * factor_nubes) | round(0) }}
          {% else %}
            {% set valor = 600 - ((h - 16) * 120) %}
            {% if valor < 0 %}
              0
            {% else %}
              {{ (valor * factor_nubes) | round(0) }}
            {% endif %}
          {% endif %}
        icon: mdi:white-balance-sunny

      - name: "ETSIT Estado gateway"
        unique_id: etsit_estado_gateway
        state: "Conectado"

