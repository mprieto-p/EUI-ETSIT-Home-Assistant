        icon: mdi:water-check

      - name: "ETSIT Riego consumo semanal estimado"
        unique_id: etsit_riego_consumo_semanal_estimado
        state: >
          {% set caudal = states('sensor.etsit_riego_caudal_por_zona') | float(0) %}

          {% set z1 = states('sensor.etsit_riego_zona_1_tiempo_semanal') | float(0) %}
          {% set z2 = states('sensor.etsit_riego_zona_2_tiempo_semanal') | float(0) %}
          {% set z3 = states('sensor.etsit_riego_zona_3_tiempo_semanal') | float(0) %}
          {% set z4 = states('sensor.etsit_riego_zona_4_tiempo_semanal') | float(0) %}
          {% set z5 = states('sensor.etsit_riego_zona_5_tiempo_semanal') | float(0) %}
          {% set z6 = states('sensor.etsit_riego_zona_6_tiempo_semanal') | float(0) %}

          {% set horas_totales = z1 + z2 + z3 + z4 + z5 + z6 %}

          {{ (horas_totales * 60 * caudal) | round(1) }}
        unit_of_measurement: "L"
        icon: mdi:calendar-week

      # ------------------------------------------------------------
      # Consumo energetico - Medidas electricas principales
      # ------------------------------------------------------------

      - name: "ETSIT Consumo potencia"
        unique_id: etsit_consumo_potencia
        state: >
          {% set h = now().hour %}
          {% set m = now().minute %}
          {% set dia = now().weekday() %}
          {% set laborable = dia < 5 %}

          {% if not laborable %}
            {% set base = 8000 %}
          {% elif h < 6 %}
            {% set base = 6000 %}
          {% elif h < 8 %}
            {% set base = 14000 %}
          {% elif h < 10 %}
            {% set base = 32000 %}
          {% elif h < 14 %}
            {% set base = 45000 %}
          {% elif h < 17 %}
            {% set base = 38000 %}
          {% elif h < 20 %}
            {% set base = 24000 %}
          {% else %}
            {% set base = 9000 %}
          {% endif %}

          {% set variacion = ((m % 10) - 5) * 250 %}
          {{ (base + variacion) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash

      - name: "ETSIT Consumo corriente"
        unique_id: etsit_consumo_corriente
        state: >
          {% set potencia = states('sensor.etsit_consumo_potencia') | float(0) %}
          {% set tension_trifasica = 400 %}
          {% set factor_potencia = states('sensor.etsit_consumo_factor_potencia') | float(0.94) %}
          {{ (potencia / (1.732 * tension_trifasica * factor_potencia)) | round(1) }}
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac

      - name: "ETSIT Consumo tension"
        unique_id: etsit_consumo_tension
        state: "230"
        unit_of_measurement: "V"
        icon: mdi:sine-wave

      - name: "ETSIT Consumo factor potencia"
        unique_id: etsit_consumo_factor_potencia
        state: "0.94"
        icon: mdi:cosine-wave

