        state: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% if irradiancia >= 300 %}
            Alta
          {% elif irradiancia >= 120 %}
            Media
          {% else %}
            Baja
          {% endif %}
        icon: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% if irradiancia >= 300 %}
            mdi:white-balance-sunny
          {% elif irradiancia >= 120 %}
            mdi:weather-partly-cloudy
          {% else %}
            mdi:weather-night
          {% endif %}

      - name: "ETSIT Alumbrado condicion cielo"
        unique_id: etsit_alumbrado_condicion_cielo
        state: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% if irradiancia >= 500 %}
            Soleado
          {% elif irradiancia >= 200 %}
            Parcialmente nublado
          {% elif irradiancia >= 80 %}
            Nublado
          {% else %}
            Muy poca luz
          {% endif %}
        icon: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% if irradiancia >= 500 %}
            mdi:weather-sunny
          {% elif irradiancia >= 200 %}
            mdi:weather-partly-cloudy
          {% elif irradiancia >= 80 %}
            mdi:weather-cloudy
          {% else %}
            mdi:weather-night
          {% endif %}

      - name: "ETSIT Alumbrado recomendacion"
        unique_id: etsit_alumbrado_recomendacion
        state: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% set umbral = states('sensor.etsit_alumbrado_umbral_encendido') | int(120) %}
          {% if irradiancia < umbral %}
            Encender luminarias
          {% elif irradiancia < 200 %}
            Preparar encendido
          {% else %}
            Mantener apagadas
          {% endif %}
        icon: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | int(0) %}
          {% set umbral = states('sensor.etsit_alumbrado_umbral_encendido') | int(120) %}
          {% if irradiancia < umbral %}
            mdi:lightbulb-on
          {% elif irradiancia < 200 %}
            mdi:lightbulb-auto
          {% else %}
            mdi:lightbulb-off
          {% endif %}

      - name: "ETSIT Horas luz hoy"
