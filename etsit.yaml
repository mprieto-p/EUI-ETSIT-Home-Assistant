      - name: "ETSIT Direccion viento"
        unique_id: etsit_direccion_viento
        state: "{{ state_attr('weather.cedint', 'wind_bearing') | float(0) }}"
        unit_of_measurement: "°"
        icon: mdi:compass

      - name: "ETSIT Temperatura sensacion termica"
        unique_id: etsit_temperatura_sensacion_termica
        state: >
          {% set temp = states('sensor.etsit_temperatura_exterior') | float(0) %}
          {% set humedad = states('sensor.etsit_humedad_relativa') | float(0) %}
          {% if temp >= 30 %}
            {{ (temp + ((humedad - 30) * 0.04)) | round(1) }}
          {% else %}
            {{ temp | round(1) }}
          {% endif %}
        unit_of_measurement: "°C"
        icon: mdi:thermometer-lines

      - name: "ETSIT Temperatura estado termico"
        unique_id: etsit_temperatura_estado_termico
        state: >
          {% set temp = states('sensor.etsit_temperatura_sensacion_termica') | float(0) %}
          {% if temp < 10 %}
            Frio intenso
          {% elif temp < 18 %}
            Frio
          {% elif temp < 26 %}
            Confortable
          {% elif temp < 32 %}
            Calor
          {% else %}
            Calor intenso
          {% endif %}
        icon: mdi:thermometer-alert

      - name: "ETSIT Alumbrado intensidad recomendada"
        unique_id: etsit_alumbrado_intensidad_recomendada
        state: >
          {% set irradiancia = states('sensor.etsit_irradiancia_solar') | float(0) %}
          {% set nubosidad = states('sensor.etsit_solar_nubosidad') | float(0) %}
          {% set presencia = is_state('input_boolean.etsit_presencia_alumbrado', 'on') %}
          {% set hora = now().hour %}

          {% if irradiancia >= 300 %}
            {% set base = 0 %}
          {% elif irradiancia >= 200 %}
            {% set base = 30 %}
          {% elif irradiancia >= 120 %}
            {% set base = 50 %}
          {% elif irradiancia >= 60 %}
            {% set base = 70 %}
          {% else %}
            {% set base = 90 %}
          {% endif %}

          {% if nubosidad >= 80 and base > 0 %}
            {% set base = base + 10 %}
          {% endif %}

          {% if presencia and base > 0 %}
            {% set base = 90 %}
          {% elif not presencia and base > 0 %}
            {% set base = 35 %}
          {% endif %}

          {% if hora >= 0 and hora < 6 and not presencia %}
            {% set base = 25 %}
          {% endif %}

          {{ [base, 100] | min }}
        unit_of_measurement: "%"
        icon: mdi:brightness-6

      - name: "ETSIT Alumbrado intensidad aplicada"
        unique_id: etsit_alumbrado_intensidad_aplicada
        state: "{{ states('input_number.etsit_alumbrado_intensidad_general') | int(0) }}"
        unit_of_measurement: "%"
        icon: mdi:brightness-6

      - name: "ETSIT Alumbrado modo intensidad"
        unique_id: etsit_alumbrado_modo_intensidad
        state: >
          {% if is_state('input_boolean.etsit_alumbrado_modo_manual_intensidad', 'on') %}
            Manual temporal
          {% else %}
            Automático
          {% endif %}
        icon: >
          {% if is_state('input_boolean.etsit_alumbrado_modo_manual_intensidad', 'on') %}
            mdi:tune-variant
          {% else %}
            mdi:brightness-auto
          {% endif %}

      # ------------------------------------------------------------
      # Iluminacion - Avisos numericos
      # ------------------------------------------------------------

      - name: "ETSIT Alumbrado farolas apagadas con encendido recomendado"
        unique_id: etsit_alumbrado_farolas_apagadas_con_encendido_recomendado
        state: >
          {% set encendidas = states('sensor.etsit_alumbrado_luminarias_encendidas') | int(0) %}
          {% set totales = states('sensor.etsit_alumbrado_luminarias_totales') | int(40) %}
          {% if is_state('sensor.etsit_alumbrado_recomendacion', 'Encender luminarias') %}
            {{ totales - encendidas }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "farolas"
        icon: mdi:lightbulb-question

      - name: "ETSIT Alumbrado farolas encendidas con luz natural suficiente"
        unique_id: etsit_alumbrado_farolas_encendidas_con_luz_natural_suficiente
        state: >
          {% set encendidas = states('sensor.etsit_alumbrado_luminarias_encendidas') | int(0) %}
          {% if is_state('sensor.etsit_alumbrado_recomendacion', 'Mantener apagadas') %}
            {{ encendidas }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "farolas"
        icon: mdi:weather-sunny-alert

      # ------------------------------------------------------------
      # Calidad del aire - Medidas principales
      # ------------------------------------------------------------

      - name: "ETSIT Calidad aire PM2.5"
        unique_id: etsit_calidad_aire_pm25
        state: >
          {% set v = states('sensor.pm2_5_rlink') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            {{ (8 + (now().minute % 6) * 0.8) | round(1) }}
          {% endif %}
        unit_of_measurement: "µg/m³"
        icon: mdi:molecule

      - name: "ETSIT Calidad aire PM10"
        unique_id: etsit_calidad_aire_pm10
        state: >
          {% set v = states('sensor.pm10_rlink') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            {{ (18 + (now().minute % 8) * 1.2) | round(1) }}
          {% endif %}
        unit_of_measurement: "µg/m³"
        icon: mdi:blur

      - name: "ETSIT Calidad aire CO"
        unique_id: etsit_calidad_aire_co
        state: >
          {% set v = states('sensor.co_rlink') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            {{ (0.2 + (now().minute % 5) * 0.03) | round(2) }}
          {% endif %}
        unit_of_measurement: "ppm"
        icon: mdi:molecule-co

      - name: "ETSIT Calidad aire NO2"
        unique_id: etsit_calidad_aire_no2
        state: >
          {% set v = states('sensor.no2_rlink') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            {{ (18 + (now().minute % 7) * 1.5) | round(1) }}
          {% endif %}
        unit_of_measurement: "µg/m³"
        icon: mdi:molecule

      - name: "ETSIT Calidad aire indice"
        unique_id: etsit_calidad_aire_indice
        state: >
          {% set pm25 = states('sensor.etsit_calidad_aire_pm25') %}
          {% set pm10 = states('sensor.etsit_calidad_aire_pm10') %}
          {% set no2 = states('sensor.etsit_calidad_aire_no2') %}
          {% set ns = namespace(score=1, datos=0) %}

          {% if pm25 not in ['unknown', 'unavailable', 'none'] %}
            {% set ns.datos = ns.datos + 1 %}
            {% set v = pm25 | float(0) %}
            {% if v > 35 %}
              {% set ns.score = [ns.score, 4] | max %}
            {% elif v > 25 %}
              {% set ns.score = [ns.score, 3] | max %}
            {% elif v > 15 %}
              {% set ns.score = [ns.score, 2] | max %}
            {% endif %}
          {% endif %}

          {% if pm10 not in ['unknown', 'unavailable', 'none'] %}
            {% set ns.datos = ns.datos + 1 %}
            {% set v = pm10 | float(0) %}
            {% if v > 50 %}
              {% set ns.score = [ns.score, 4] | max %}
            {% elif v > 40 %}
              {% set ns.score = [ns.score, 3] | max %}
            {% elif v > 20 %}
              {% set ns.score = [ns.score, 2] | max %}
            {% endif %}
          {% endif %}

          {% if no2 not in ['unknown', 'unavailable', 'none'] %}
            {% set ns.datos = ns.datos + 1 %}
            {% set v = no2 | float(0) %}
            {% if v > 120 %}
              {% set ns.score = [ns.score, 4] | max %}
            {% elif v > 80 %}
              {% set ns.score = [ns.score, 3] | max %}
            {% elif v > 40 %}
              {% set ns.score = [ns.score, 2] | max %}
            {% endif %}
          {% endif %}

          {% if ns.datos == 0 %}
            unknown
          {% else %}
            {{ ns.score }}
          {% endif %}
        icon: mdi:air-filter

      - name: "ETSIT Calidad aire estado"
        unique_id: etsit_calidad_aire_estado
        state: >
          {% set indice = states('sensor.etsit_calidad_aire_indice') %}
          {% if indice in ['unknown', 'unavailable', 'none'] %}
            Sin datos
          {% elif indice | int(0) == 1 %}
            Buena
          {% elif indice | int(0) == 2 %}
            Aceptable
          {% elif indice | int(0) == 3 %}
            Regular
          {% else %}
            Mala
          {% endif %}
        icon: >
          {% set indice = states('sensor.etsit_calidad_aire_indice') | int(0) %}
          {% if indice <= 1 %}
            mdi:emoticon-happy
          {% elif indice == 2 %}
            mdi:emoticon-neutral
          {% elif indice == 3 %}
            mdi:emoticon-confused
          {% else %}
            mdi:emoticon-sad
          {% endif %}

      - name: "ETSIT Calidad aire recomendacion"
        unique_id: etsit_calidad_aire_recomendacion
        state: >
          {% set estado = states('sensor.etsit_calidad_aire_estado') %}
          {% if estado == 'Buena' %}
            Calidad del aire adecuada
          {% elif estado == 'Aceptable' %}
            Vigilar evolución
          {% elif estado == 'Regular' %}
            Revisar ventilación y exposición
          {% elif estado == 'Mala' %}
            Reducir exposición exterior
          {% else %}
            Sin datos suficientes
          {% endif %}
        icon: mdi:message-alert-outline

      # ------------------------------------------------------------
      # Precipitaciones - Medidas principales
      # ------------------------------------------------------------

      - name: "ETSIT Precipitaciones altura agua"
        unique_id: etsit_precipitaciones_altura_agua
        state: >
          {% set v = states('sensor.water_level_sensor') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "cm"
        icon: mdi:waves-arrow-up

      - name: "ETSIT Precipitaciones lluvia acumulada"
        unique_id: etsit_precipitaciones_lluvia_acumulada
        state: >
          {% set v = states('sensor.rain_gauge_sensor') %}
          {% if v not in ['unknown', 'unavailable', 'none'] %}
            {{ v | float(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "mm"
        icon: mdi:weather-pouring

      - name: "ETSIT Precipitaciones nivel riesgo"
        unique_id: etsit_precipitaciones_nivel_riesgo
        state: >
          {% set agua = states('sensor.etsit_precipitaciones_altura_agua') | float(0) %}
          {% set lluvia = states('sensor.etsit_precipitaciones_lluvia_acumulada') | float(0) %}
          {% set inundacion = is_state('binary_sensor.flooding_sensor_alarm_a_nuevo', 'on') %}

          {% if inundacion %}
            Riesgo alto
          {% elif agua >= 10 or lluvia >= 20 %}
            Riesgo alto
          {% elif agua >= 5 or lluvia >= 10 %}
            Riesgo medio
          {% elif agua > 0 or lluvia > 0 %}
            Riesgo bajo
          {% else %}
            Sin riesgo
          {% endif %}
        icon: mdi:alert-circle

      - name: "ETSIT Precipitaciones recomendacion"
        unique_id: etsit_precipitaciones_recomendacion
        state: >
          {% set riesgo = states('sensor.etsit_precipitaciones_nivel_riesgo') %}
          {% if riesgo == 'Riesgo alto' %}
            Revisar posible inundación
          {% elif riesgo == 'Riesgo medio' %}
            Vigilar acumulación de agua
          {% elif riesgo == 'Riesgo bajo' %}
            Lluvia detectada sin riesgo relevante
          {% else %}
            Sin incidencias por precipitación
          {% endif %}
        icon: mdi:message-alert-outline

      # ------------------------------------------------------------
      # Precipitaciones - Estado de avisos
      # ------------------------------------------------------------

      - name: "ETSIT Precipitaciones estado lluvia"
        unique_id: etsit_precipitaciones_estado_lluvia
        state: >
          {% if is_state('binary_sensor.etsit_precipitaciones_aviso_lluvia', 'on') %}
            Detectada
          {% else %}
            No detectada
          {% endif %}
        icon: mdi:weather-rainy

      - name: "ETSIT Precipitaciones estado nivel agua"
        unique_id: etsit_precipitaciones_estado_nivel_agua
        state: >
          {% if is_state('binary_sensor.etsit_precipitaciones_aviso_nivel_agua_alto', 'on') %}
            Alto
          {% else %}
            Normal
          {% endif %}
        icon: mdi:waves-arrow-up

      - name: "ETSIT Precipitaciones estado inundacion"
        unique_id: etsit_precipitaciones_estado_inundacion
        state: >
          {% if is_state('binary_sensor.etsit_precipitaciones_inundacion_detectada', 'on') %}
            Detectada
          {% else %}
            No detectada
          {% endif %}
        icon: mdi:waves

      - name: "ETSIT Precipitaciones estado riesgo alto"
        unique_id: etsit_precipitaciones_estado_riesgo_alto
        state: >
          {% if is_state('binary_sensor.etsit_precipitaciones_aviso_riesgo_alto', 'on') %}
            Activo
          {% else %}
            Inactivo
          {% endif %}
        icon: mdi:alert-octagon

      # ------------------------------------------------------------
      # Residuos - Resumen
      # ------------------------------------------------------------

      - name: "ETSIT Residuos llenado medio"
        unique_id: etsit_residuos_llenado_medio
        state: >
          {% set valores = [
            states('sensor.etsit_residuos_1_llenado') | float(0),
            states('sensor.etsit_residuos_2_llenado') | float(0),
            states('sensor.etsit_residuos_3_llenado') | float(0),
            states('sensor.etsit_residuos_4_llenado') | float(0),
            states('sensor.etsit_residuos_5_llenado') | float(0)
          ] %}
          {{ (valores | sum / valores | count) | round(1) }}
        unit_of_measurement: "%"
        icon: mdi:delete-percent

      - name: "ETSIT Residuos contenedores en aviso"
        unique_id: etsit_residuos_contenedores_en_aviso
        state: >
          {{
            [
              is_state('binary_sensor.etsit_residuos_1_alarma', 'on'),
              is_state('binary_sensor.etsit_residuos_2_alarma', 'on'),
              is_state('binary_sensor.etsit_residuos_3_alarma', 'on'),
              is_state('binary_sensor.etsit_residuos_4_alarma', 'on'),
              is_state('binary_sensor.etsit_residuos_5_alarma', 'on')
            ] | select('eq', true) | list | count
          }}
        unit_of_measurement: "contenedores"
        icon: mdi:trash-can-alert

      - name: "ETSIT Residuos estado general"
        unique_id: etsit_residuos_estado_general
        state: >
          {% set avisos = states('sensor.etsit_residuos_contenedores_en_aviso') | int(0) %}
          {% set media = states('sensor.etsit_residuos_llenado_medio') | float(0) %}
          {% if avisos > 0 %}
            Vaciado requerido
          {% elif media >= 60 %}
            Seguimiento recomendado
          {% else %}
            Estado normal
          {% endif %}
        icon: mdi:recycle

      - name: "ETSIT Residuos recomendacion"
        unique_id: etsit_residuos_recomendacion
        state: >
          {% set avisos = states('sensor.etsit_residuos_contenedores_en_aviso') | int(0) %}
          {% if avisos >= 3 %}
            Programar ruta de vaciado completa
          {% elif avisos > 0 %}
            Revisar contenedores en aviso
          {% else %}
            Sin necesidad de vaciado inmediato
          {% endif %}
        icon: mdi:message-alert-outline

      # ------------------------------------------------------------
      # Residuos - Estado de avisos en texto
      # ------------------------------------------------------------

      - name: "ETSIT Residuos 1 estado vaciado"
        unique_id: etsit_residuos_1_estado_vaciado
        state: >
          {% if is_state('binary_sensor.etsit_residuos_1_alarma', 'on') %}
            Vaciado requerido
          {% else %}
            Sin aviso
          {% endif %}
        icon: mdi:trash-can

      - name: "ETSIT Residuos 2 estado vaciado"
        unique_id: etsit_residuos_2_estado_vaciado
        state: >
          {% if is_state('binary_sensor.etsit_residuos_2_alarma', 'on') %}
            Vaciado requerido
          {% else %}
            Sin aviso
          {% endif %}
        icon: mdi:trash-can

      - name: "ETSIT Residuos 3 estado vaciado"
        unique_id: etsit_residuos_3_estado_vaciado
        state: >
          {% if is_state('binary_sensor.etsit_residuos_3_alarma', 'on') %}
            Vaciado requerido
          {% else %}
            Sin aviso
          {% endif %}
        icon: mdi:trash-can

      - name: "ETSIT Residuos 4 estado vaciado"
        unique_id: etsit_residuos_4_estado_vaciado
        state: >
          {% if is_state('binary_sensor.etsit_residuos_4_alarma', 'on') %}
            Vaciado requerido
          {% else %}
            Sin aviso
          {% endif %}
        icon: mdi:trash-can

      - name: "ETSIT Residuos 5 estado vaciado"
        unique_id: etsit_residuos_5_estado_vaciado
        state: >
          {% if is_state('binary_sensor.etsit_residuos_5_alarma', 'on') %}
            Vaciado requerido
          {% else %}
            Sin aviso
          {% endif %}
        icon: mdi:trash-can

      # ------------------------------------------------------------
      # Resumen general EUI ETSIT
      # ------------------------------------------------------------

      - name: "ETSIT Resumen incidencias activas"
        unique_id: etsit_resumen_incidencias_activas
        state: >
          {% set ns = namespace(total=0) %}

          {# Red #}
          {% if states('sensor.etsit_red_nodos_desconectados') | int(0) > 0 %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_alarma_calidad_red_baja', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Residuos #}
          {% if states('sensor.etsit_residuos_contenedores_en_aviso') | int(0) > 0 %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Alumbrado #}
          {% if states('sensor.etsit_alumbrado_fallos_en_luminarias') | int(0) > 0 %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if states('sensor.etsit_alumbrado_farolas_apagadas_con_encendido_recomendado') | int(0) > 0 %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if states('sensor.etsit_alumbrado_farolas_encendidas_con_luz_natural_suficiente') | int(0) > 0 %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Riego #}
          {% if is_state('binary_sensor.etsit_riego_aviso_caudal_alto', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_riego_aviso_muchas_zonas_activas', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_riego_aviso_consumo_ciclo_alto', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_riego_aviso_duracion_alta', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Consumo electrico #}
          {% if is_state('binary_sensor.etsit_consumo_aviso_potencia_alta', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_consumo_aviso_corriente_alta', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_consumo_aviso_factor_potencia_bajo', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Calidad del aire #}
          {% if is_state('binary_sensor.etsit_calidad_aire_aviso_general', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {# Precipitaciones #}
          {% if is_state('binary_sensor.etsit_precipitaciones_aviso_riesgo_alto', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.etsit_precipitaciones_inundacion_detectada', 'on') %}
            {% set ns.total = ns.total + 1 %}
          {% endif %}

          {{ ns.total }}
        unit_of_measurement: "incidencias"
        icon: mdi:alert-circle-outline

      - name: "ETSIT Resumen estado general"
        unique_id: etsit_resumen_estado_general
        state: >
          {% set incidencias = states('sensor.etsit_resumen_incidencias_activas') | int(0) %}
          {% set red = states('sensor.etsit_red_calidad_general') %}
          {% set aire = states('sensor.etsit_calidad_aire_estado') %}
          {% set precipitaciones = states('sensor.etsit_precipitaciones_nivel_riesgo') %}

          {% if incidencias >= 5 %}
            Atención prioritaria
          {% elif precipitaciones == 'Riesgo alto' %}
            Alerta por precipitaciones
          {% elif aire == 'Mala' %}
            Alerta por calidad del aire
          {% elif red in ['Mala', 'Critica', 'Crítica'] %}
            Alerta de comunicaciones
          {% elif incidencias > 0 %}
            Incidencias activas
          {% else %}
            Funcionamiento normal
          {% endif %}
        icon: >
          {% set estado = states('sensor.etsit_resumen_estado_general') %}
          {% if estado == 'Funcionamiento normal' %}
            mdi:check-circle
          {% elif estado == 'Incidencias activas' %}
            mdi:alert
          {% else %}
            mdi:alert-octagon
          {% endif %}

      - name: "ETSIT Resumen recomendacion general"
        unique_id: etsit_resumen_recomendacion_general
        state: >
          {% set incidencias = states('sensor.etsit_resumen_incidencias_activas') | int(0) %}
          {% set residuos = states('sensor.etsit_residuos_contenedores_en_aviso') | int(0) %}
          {% set precipitaciones = states('sensor.etsit_precipitaciones_nivel_riesgo') %}
          {% set aire = states('sensor.etsit_calidad_aire_estado') %}
          {% set red_desconectados = states('sensor.etsit_red_nodos_desconectados') | int(0) %}

          {% if precipitaciones == 'Riesgo alto' %}
            Revisar drenaje e inundaciones
          {% elif aire in ['Regular', 'Mala'] %}
            Revisar condiciones ambientales
          {% elif red_desconectados > 0 %}
            Revisar nodos IoT desconectados
          {% elif residuos > 0 %}
            Revisar contenedores en aviso
          {% elif incidencias > 0 %}
            Revisar avisos activos del sistema
          {% else %}
            Sin acciones urgentes
          {% endif %}
        icon: mdi:clipboard-check-outline

  - binary_sensor:
      # ------------------------------------------------------------
      # Residuos - alarmas de llenado de prueba
      # La alarma se activa cuando el llenado es mayor o igual al 80%.
      # ------------------------------------------------------------

      - name: "ETSIT Residuos 1 alarma"
        unique_id: etsit_residuos_1_alarma
        device_class: problem
        state: "{{ states('sensor.etsit_residuos_1_llenado') | float(0) >= 80 }}"

      - name: "ETSIT Residuos 2 alarma"
        unique_id: etsit_residuos_2_alarma
        device_class: problem
        state: "{{ states('sensor.etsit_residuos_2_llenado') | float(0) >= 80 }}"

      - name: "ETSIT Residuos 3 alarma"
        unique_id: etsit_residuos_3_alarma
        device_class: problem
        state: "{{ states('sensor.etsit_residuos_3_llenado') | float(0) >= 80 }}"

      - name: "ETSIT Residuos 4 alarma"
        unique_id: etsit_residuos_4_alarma
        device_class: problem
        state: "{{ states('sensor.etsit_residuos_4_llenado') | float(0) >= 80 }}"

      - name: "ETSIT Residuos 5 alarma"
