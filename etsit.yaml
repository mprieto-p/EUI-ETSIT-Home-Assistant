          {% set prob_lluvia = states('sensor.etsit_riego_probabilidad_lluvia') | float(0) %}

          {% if lluvia > 0 %}
            No regar: lluvia reciente
          {% elif prob_lluvia >= 70 %}
            No regar: alta probabilidad de lluvia
          {% elif humedad < 30 %}
