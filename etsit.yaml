automation:
  - alias: "Auto Watering: Zone 1 High Temperature"
    description: "Starts watering Zone 1 when temperature is too high, with a cooldown constraint."
    mode: single # Ensures the automation doesn't run multiple times concurrently
    trigger:
      - trigger: numeric_state
        # Make sure this matches the exact entity_id generated by your MQTT sensor
        entity_id: sensor.earth_meter_0a_38_0_temp_ciec
        above: 30 # REPLACE with your desired temperature threshold in °C
    condition:
      - condition: template
        # This template checks if the automation has run in the last X seconds.
        # 43200 seconds = 12 hours. Change this number to your desired cooldown interval.
        value_template: >
          {{ state_attr('automation.auto_watering_zone_1_high_temperature', 'last_triggered') == None or 
            (as_timestamp(now()) - as_timestamp(state_attr('automation.auto_watering_zone_1_high_temperature', 'last_triggered'))) > 43200 }}
    action:
      - action: script.regar_zona_1
        data:
          # Pass the override directly here (e.g., 600 seconds = 10 minutes)
          duration_override: 60
  - alias: "Smart Parking: Dynamic DALI Light Boost (On-Demand Fetch)"
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.smart_parking_49_b7_00
        to: "on"
    action:
      # 1. Fire the GET request and save the JSON response to a variable
      - action: rest_command.get_dali_light_level
        data:
          device_uid: "B10000CF210CEF00"
        response_variable: api_response

      # 2. Extract the dimming value from the response
      - variables:
          # 'api_response.content' holds the parsed JSON body
          previous_dim_level: >
            {{ api_response.content.objects[0].resources[0].value | default(0) }}

      # 3. Boost the light to 100%
      - action: rest_command.set_dali_light_intensity
        data:
          device_uid: "B10000CF210CEF00"
          gateway_mac: "F8:DC:7A:70:36:79"
          intensity: 255

      # 4. Keep it bright while they park
      - delay: "00:05:00"

      # 5. Restore the exact previous level using the snapshot
      - action: rest_command.set_dali_light_intensity
        data:
          device_uid: "B10000CF210CEF00"
          gateway_mac: "F8:DC:7A:70:36:79"
          intensity: "{{ (previous_dim_level * 255 / 100) | int }}"

  # ------------------------------------------------------------
  # Aparcamiento - Evitar reservas en plazas ocupadas
  # ------------------------------------------------------------

  - alias: "ETSIT Aparcamiento cancelar reserva plaza 1 ocupada"
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.etsit_aparcamiento_1_reserva
          - binary_sensor.etsit_aparcamiento_1_ocupacion
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.etsit_aparcamiento_1_ocupacion
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.etsit_aparcamiento_1_reserva
    mode: single

  - alias: "ETSIT Aparcamiento cancelar reserva plaza 2 ocupada"
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.etsit_aparcamiento_2_reserva
          - binary_sensor.etsit_aparcamiento_2_ocupacion
        to: "on"
    conditions:
